# Sample persona: 64-bit RISC-V (e.g. SiFive HiFive Unmatched / StarFive VisionFive class board)
persona:
  arch: riscv64
  hostname: buildroot
  kernel_version: "5.10.0"
  isa: rv64imafdc
  uarch: "sifive,u74-mc"
  mmu: sv39
  hart_count: 4
  os_release_name: Buildroot
  os_release_version: "2023.02"
  ssh_banner: "SiFive RISC-V Linux (buildroot)"
  ssh_server_id: "dropbear_2020.81"
  telnet_banner: |
    SiFive RISC-V Linux (buildroot)
    login: 

listeners:
  bind_host: "0.0.0.0"
  ssh_enabled: true
  ssh_port: 2222
  telnet_enabled: true
  telnet_port: 2223

credentials:
  # accept_any=true (literally any credential succeeds) is itself a
  # honeypot tell, per the pentest note in CLAUDE.md -- a login is now
  # accepted only when the username and password each independently
  # appear in a real-world-observed wordlist, which still captures the
  # overwhelming majority of scanner traffic while rejecting arbitrary
  # probe strings. allow_list stays as an always-accepted fast path for
  # exact pairs worth guaranteeing (e.g. Mirai's xc3511, which a general
  # password list doesn't contain).
  accept_any: false
  username_wordlist_path: configs/SSH-usernames_1000_14d_2026-08_LureScope.txt
  password_wordlist_path: configs/100k-most-used-passwords-NCSC.txt
  allow_list:
    - {username: root, password: root}
    - {username: admin, password: admin}
    - {username: root, password: "12345"}
    - {username: root, password: xc3511}

fetcher:
  quarantine_dir: var/quarantine
  jobs_dir: var/jobs
  max_file_size_bytes: 52428800
  timeout_seconds: 15
  allowed_protocols: [http, https]
  verify_tls: false

logging:
  log_dir: var/logs
  transcript_dir: var/transcripts
  json_log_filename: events.jsonl
  level: INFO
  forward_url: null
