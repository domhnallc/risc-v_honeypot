# logrotate config for the honeypot's structured event log.
#
# Only covers var/logs/*.jsonl (events.jsonl) -- the one file here that
# grows forever via appends. var/transcripts/ and var/jobs/.processing/ are
# many small per-session/per-job files rather than one growing file, so
# they're pruned by age instead; see cleanup-var.sh in this directory.
# var/quarantine/ is deliberately NOT touched by either mechanism -- those
# are captured samples, not logs, and nothing here should ever delete one
# without a human deciding to.
#
# Install (substitute your actual clone path for /root/risc-v_honeypot):
#   sudo sed 's#/root/risc-v_honeypot#'"$HOME"'/risc-v_honeypot#' \
#     deploy/logrotate-riscv-honeypot.conf | sudo tee /etc/logrotate.d/riscv-honeypot
#   sudo logrotate --debug /etc/logrotate.d/riscv-honeypot   # dry run, confirm no errors
#
# EventLogger (honeypot/logging/events.py) opens the file fresh with
# mode "a" on every single write and closes it immediately -- it never
# holds a long-lived file descriptor open -- so a plain rename-based
# rotation (the logrotate default) works with no postrotate signal needed;
# the next write just creates a new file at the same path.

/root/risc-v_honeypot/var/logs/*.jsonl {
    daily
    rotate 30
    compress
    delaycompress
    missingok
    notifempty
    su root root
}
