[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "riscv-honeypot"
version = "0.1.0"
description = "Medium-interaction SSH/Telnet honeypot impersonating a RISC-V Linux IoT device"
requires-python = ">=3.11"
dependencies = [
    "asyncssh>=2.14",
    "aiohttp>=3.9",
    "pydantic>=2.4",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["honeypot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
