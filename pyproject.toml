[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "riscv-honeypot"
version = "0.1.0"
description = "Medium-interaction SSH/Telnet honeypot impersonating a RISC-V Linux IoT device"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
dependencies = [
    "asyncssh>=2.14",
    "aiohttp>=3.9",
    "pydantic>=2.4",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# For tools/dashboard.py only -- a standalone reporting script, not part of
# the honeypot runtime package (see that file's module docstring).
dashboard = ["maxminddb>=2.2"]

[tool.setuptools.packages.find]
include = ["honeypot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
